  window.tlUpdate=function(m){var _pi=-1;for(var _i=0;_i<ROUTE_TIMES.length;_i++){{if(ROUTE_TIMES[_i]<=m)_pi=_i;else break;}}var _pc=null;if(_pi>=0){var _gap=(_pi<ROUTE_TIMES.length-1)?(ROUTE_TIMES[_pi+1]-ROUTE_TIMES[_pi]):0;if(_pi<routeCoords.length-1&&_gap<=10){var _t0=ROUTE_TIMES[_pi],_t1=ROUTE_TIMES[_pi+1]||_t0+1;var _fr=Math.max(0,Math.min(1,(_t1>_t0?(m-_t0)/(_t1-_t0):0)));var _p0=routeCoords[_pi],_p1=routeCoords[_pi+1];_pc=[_p0[0]+_fr*(_p1[0]-_p0[0]),_p0[1]+_fr*(_p1[1]-_p0[1])];}else{_pc=routeCoords[_pi];}}var _capT=m;HIKE_TIMES.forEach(function(h){if(m>=h.s&&m<h.e)_capT=h.s;});var pts=routeCoords.filter(function(_,i){return ROUTE_TIMES[i]<=_capT;});if(_pc&&pts.length>0){pts=pts.slice();pts[pts.length-1]=_pc;}map.getSource('route').setData({type:'Feature',geometry:{type:'LineString',coordinates:pts.length>=2?pts:routeCoords.slice(0,1)}});HIKE_TIMES.forEach(function(h,i){var vis=m<h.s?'none':'visible';['hike-'+i+'-casing','hike-'+i].forEach(function(id){if(map.getLayer(id))map.setLayoutProperty(id,'visibility',vis);});if(hikeMarkers[i])hikeMarkers[i].getElement().style.display=m<h.s?'none':'';if(m>=h.s){var hpts=HIKE_COORDS[i].filter(function(_,j){return HIKE_POINT_TIMES[i][j]<=m;});if(m<h.e){var _hpi=-1;for(var _hi=0;_hi<HIKE_POINT_TIMES[i].length;_hi++){if(HIKE_POINT_TIMES[i][_hi]<=m)_hpi=_hi;else break;}if(_hpi>=0&&_hpi<HIKE_COORDS[i].length-1){var _ht0=HIKE_POINT_TIMES[i][_hpi],_ht1=HIKE_POINT_TIMES[i][_hpi+1]||_ht0+1;var _hfr=Math.max(0,Math.min(1,(_ht1>_ht0?(m-_ht0)/(_ht1-_ht0):0)));var _hp0=HIKE_COORDS[i][_hpi],_hp1=HIKE_COORDS[i][_hpi+1];_pc=[_hp0[0]+_hfr*(_hp1[0]-_hp0[0]),_hp0[1]+_hfr*(_hp1[1]-_hp0[1])];if(hpts.length>0){hpts=hpts.slice();hpts[hpts.length-1]=_pc;}}}if(hpts.length>=2&&map.getSource('hike-'+i))map.getSource('hike-'+i).setData({type:'Feature',geometry:{type:'LineString',coordinates:hpts}});}});if(false){var feats=ALL_PHOTOS.filter(function(f){return f.properties.t<=m;});map.getSource('photos').setData({type:'FeatureCollection',features:feats});}if(_pc){map.getSource('pos').setData({type:'Feature',geometry:{type:'Point',coordinates:_pc}});}};
  if(typeof window.tlSync==='function')window.tlSync();else if(typeof window.tlUpdate==='function')window.tlUpdate(1440);

  document.getElementById('chk-poi-charging').addEventListener('change',e=>(poiGroups['charging']||[]).forEach(m=>m.getElement().style.display=e.target.checked?'':'none'));
});

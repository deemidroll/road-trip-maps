  map.addSource('mapbox-dem', {
    type: 'raster-dem',
    url: 'mapbox://mapbox.mapbox-terrain-dem-v1',
    tileSize: 512, maxzoom: 14
  });
  map.setTerrain({source:'mapbox-dem', exaggeration:1.5});

  map.addSource('route', {
    type: 'geojson', lineMetrics: true,
    data: {type:'Feature',geometry:{type:'LineString',coordinates:routeCoords}}
  });
  map.addLayer({
    id:'route-casing', type:'line', source:'route',
    layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-width':7,'line-opacity':0.6,'line-color':'#000'}
  });
  map.addLayer({
    id:'route', type:'line', source:'route',
    layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-width':4,'line-opacity':1,
      'line-gradient':['interpolate',['linear'],['line-progress'],0,'#29e664',1,'#ff4628']}
  });

  map.addSource('pos',{type:'geojson',data:{type:'Feature',geometry:{type:'Point',coordinates:[0,0]}}});
  map.addLayer({id:'pos-halo',type:'circle',source:'pos',paint:{'circle-radius':18,'circle-color':'#4a9eff','circle-opacity':0.18,'circle-stroke-width':0}});
  map.addLayer({id:'pos-dot', type:'circle',source:'pos',paint:{'circle-radius':7,'circle-color':'#fff','circle-stroke-width':2.5,'circle-stroke-color':'#4a9eff'}});

  const ALL_PHOTOS=[{"type": "Feature", "geometry": {"type": "Point", "coordinates": [-106.478, 31.891]}, "properties": {"t": 826}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [-106.5633, 31.9072]}, "properties": {"t": 833}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [-106.5808, 31.8864]}, "properties": {"t": 838}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [-106.8471, 32.4292]}, "properties": {"t": 1084}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [-107.3188, 32.92]}, "properties": {"t": 1123}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [-107.1886, 33.1906]}, "properties": {"t": 1190}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [-107.1875, 33.1928]}, "properties": {"t": 1200}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [-107.1875, 33.1956]}, "properties": {"t": 1207}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [-107.1889, 33.1939]}, "properties": {"t": 1216}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [-107.2486, 33.1557]}, "properties": {"t": 1249}}];
  map.addSource('photos',{type:'geojson',data:{type:'FeatureCollection',features:ALL_PHOTOS}});
  map.addLayer({id:'photo-heat',type:'heatmap',source:'photos',paint:{'heatmap-radius':30,'heatmap-opacity':0.65,'heatmap-color':['interpolate',['linear'],['heatmap-density'],0,'rgba(0,0,0,0)',0.05,'rgba(103,169,207,0.5)',0.5,'rgba(254,224,144,0.75)',0.8,'rgba(252,141,89,0.88)',1,'rgba(215,48,31,0.95)']}});
  map.addSource('hike-0',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[]}}});
  map.addLayer({id:'hike-0-casing',type:'line',source:'hike-0',layout:{'line-cap':'round','line-join':'round','visibility':'none'},paint:{'line-color':'#ffffff','line-width':5.5,'line-opacity':0.9}});
  map.addLayer({id:'hike-0',type:'line',source:'hike-0',layout:{'line-cap':'round','line-join':'round','visibility':'none'},paint:{'line-color':'rgb(233,95,42)','line-width':3.5,'line-opacity':1}});

  if (routeCoords.length > 0) {
    const bounds = routeCoords.reduce(
      (b,c) => b.extend(c),
      new mapboxgl.LngLatBounds(routeCoords[0], routeCoords[0])
    );
    window._mapBounds = bounds;
    map.fitBounds(bounds,{padding:{top:90,right:40,bottom:_tlPadBottom(),left:40},duration:0});
  } else {
    window._mapBounds = map.getBounds();
  }

  map.on('rotate', function() {
    var b = map.getBearing();
    document.getElementById('compass-svg').style.transform = 'rotate('+(-b)+'deg)';
  });

  
  if(typeof window.tlSync==='function')window.tlSync();else if(typeof window.tlUpdate==='function')window.tlUpdate(0);

  document.getElementById('chk-route').addEventListener('change',e=>{['route','route-casing'].forEach(id=>map.setLayoutProperty(id,'visibility',e.target.checked?'visible':'none'));});
  document.getElementById('chk-heat').addEventListener('change',e=>map.setLayoutProperty('photo-heat','visibility',e.target.checked?'visible':'none'));
  document.getElementById('chk-hikes').addEventListener('change',e=>{["hike-0-casing", "hike-0"].forEach(id=>map.setLayoutProperty(id,'visibility',e.target.checked?'visible':'none'));hikeMarkers.forEach(m=>m.getElement().style.display=e.target.checked?'':'none');});
  document.getElementById('chk-poi-accommodation').addEventListener('change',e=>(poiGroups['accommodation']||[]).forEach(m=>m.getElement().style.display=e.target.checked?'':'none'));
});
var _lb=document.getElementById('layers-btn'),_ls=document.getElementById('layer-sheet'),_lc=document.getElementById('layer-sheet-close'),_lbd=document.getElementById('layer-sheet-backdrop');
_lb.addEventListener('click',function(e){e.stopPropagation();_ls.classList.toggle('open');});
_lc.addEventListener('click',function(){_ls.classList.remove('open');});
_lbd.addEventListener('click',function(){_ls.classList.remove('open');});
document.getElementById('btn-compass').addEventListener('click',function(){map.easeTo({bearing:0,duration:300});});
map.on('pitch',function(){document.getElementById('btn-3d').textContent=map.getPitch()>5?'3D':'2D';});
document.getElementById('btn-3d').addEventListener('click',function(){map.easeTo({pitch:map.getPitch()>5?0:60,duration:500});});
document.getElementById('btn-locate').addEventListener('click',function(){map.fitBounds(window._mapBounds,{padding:{top:90,right:40,bottom:_tlPadBottom(),left:40},duration:500});});
</script>
<script>
document.addEventListener('gesturestart',function(e){e.preventDefault();},false);
document.addEventListener('touchmove',function(e){if(e.scale!==undefined&&e.scale!==1)e.preventDefault();},{passive:false});
(function(){var _lt=0;document.addEventListener('touchend',function(e){var now=Date.now();if(now-_lt<300)e.preventDefault();_lt=now;},{passive:false});})();
</script>
</body>
</html>

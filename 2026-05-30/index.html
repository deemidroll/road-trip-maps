document.getElementById('btn-3d').addEventListener('click',function(){map.easeTo({pitch:map.getPitch()>5?0:60,duration:500});});
document.getElementById('btn-locate').addEventListener('click',function(){map.fitBounds(window._mapBounds,{padding:{top:90,right:40,bottom:_tlPadBottom(),left:40},duration:500});});
</script>
<script>
document.addEventListener('gesturestart',function(e){e.preventDefault();},false);
document.addEventListener('touchmove',function(e){if(e.scale!==undefined&&e.scale!==1)e.preventDefault();},{passive:false});
(function(){var _lt=0;document.addEventListener('touchend',function(e){var now=Date.now();if(now-_lt<300)e.preventDefault();_lt=now;},{passive:false});})();
</script>
</body>
</html>

  document.getElementById('chk-route').addEventListener('change',e=>{['route','route-casing'].forEach(id=>map.setLayoutProperty(id,'visibility',e.target.checked?'visible':'none'));});
  document.getElementById('chk-poi-charging').addEventListener('change',e=>(poiGroups['charging']||[]).forEach(m=>m.getElement().style.display=e.target.checked?'':'none'));
});
var _lb=document.getElementById('layers-btn'),_ls=document.getElementById('layer-sheet'),_lc=document.getElementById('layer-sheet-close'),_lbd=document.getElementById('layer-sheet-backdrop');
_lb.addEventListener('click',function(e){e.stopPropagation();_ls.classList.toggle('open');});
_lc.addEventListener('click',function(){_ls.classList.remove('open');});
_lbd.addEventListener('click',function(){_ls.classList.remove('open');});
document.getElementById('btn-compass').addEventListener('click',function(){map.easeTo({bearing:0,duration:300});});
map.on('pitch',function(){document.getElementById('btn-3d').textContent=map.getPitch()>5?'3D':'2D';});
document.getElementById('btn-3d').addEventListener('click',function(){map.easeTo({pitch:map.getPitch()>5?0:60,duration:500});});
document.getElementById('btn-locate').addEventListener('click',function(){map.fitBounds(window._mapBounds,{padding:{top:90,right:40,bottom:_tlPadBottom(),left:40},duration:500});});
</script>
<script>
document.addEventListener('gesturestart',function(e){e.preventDefault();},false);
document.addEventListener('touchmove',function(e){if(e.scale!==undefined&&e.scale!==1)e.preventDefault();},{passive:false});
(function(){var _lt=0;document.addEventListener('touchend',function(e){var now=Date.now();if(now-_lt<300)e.preventDefault();_lt=now;},{passive:false});})();

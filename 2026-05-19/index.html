function _tlPadBottom(){var _tl=document.getElementById('tl');if(!_tl)return 110;var _h=_tl.offsetHeight+20;var _vw=_tl.querySelector('.tl-vw');if(_vw){_h+=_tl.offsetWidth*9/16+8;}return Math.round(_h);}

map.on('load', () => {
  map.addSource('mapbox-dem', {
    type: 'raster-dem',
    url: 'mapbox://mapbox.mapbox-terrain-dem-v1',
    tileSize: 512, maxzoom: 14
  });
  map.setTerrain({source:'mapbox-dem', exaggeration:1.5});

  map.addSource('route', {
    type: 'geojson', lineMetrics: true,
    data: {type:'Feature',geometry:{type:'LineString',coordinates:routeCoords}}
  });
  map.addLayer({
    id:'route-casing', type:'line', source:'route',
    layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-width':7,'line-opacity':0.6,'line-color':'#000'}
  });
  map.addLayer({
    id:'route', type:'line', source:'route',
    layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-width':4,'line-opacity':1,
      'line-gradient':['interpolate',['linear'],['line-progress'],0,'#29e664',1,'#ff4628']}
  });

  map.addSource('pos',{type:'geojson',data:{type:'Feature',geometry:{type:'Point',coordinates:[0,0]}}});
  map.addLayer({id:'pos-halo',type:'circle',source:'pos',paint:{'circle-radius':18,'circle-color':'#4a9eff','circle-opacity':0.18,'circle-stroke-width':0}});
  map.addLayer({id:'pos-dot', type:'circle',source:'pos',paint:{'circle-radius':7,'circle-color':'#fff','circle-stroke-width':2.5,'circle-stroke-color':'#4a9eff'}});

  
  map.addSource('hike-0',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[]}}});
  map.addLayer({id:'hike-0-casing',type:'line',source:'hike-0',layout:{'line-cap':'round','line-join':'round','visibility':'none'},paint:{'line-color':'#ffffff','line-width':5.5,'line-opacity':0.9}});
  map.addLayer({id:'hike-0',type:'line',source:'hike-0',layout:{'line-cap':'round','line-join':'round','visibility':'none'},paint:{'line-color':'rgb(233,95,42)','line-width':3.5,'line-opacity':1}});
  

  if (routeCoords.length > 0) {
    const bounds = routeCoords.reduce(
      (b,c) => b.extend(c),
      new mapboxgl.LngLatBounds(routeCoords[0], routeCoords[0])
    );
    window._mapBounds = bounds;
    map.fitBounds(bounds,{padding:{top:90,right:40,bottom:_tlPadBottom(),left:40},duration:0});
  } else {
    window._mapBounds = map.getBounds();
  }

  map.on('rotate', function() {
    var b = map.getBearing();
    document.getElementById('compass-svg').style.transform = 'rotate('+(-b)+'deg)';
  });

  window.tlUpdate=function(m){var _pi=-1;for(var _i=0;_i<ROUTE_TIMES.length;_i++){{if(ROUTE_TIMES[_i]<=m)_pi=_i;else break;}}var _pc=null;if(_pi>=0){var _gap=(_pi<ROUTE_TIMES.length-1)?(ROUTE_TIMES[_pi+1]-ROUTE_TIMES[_pi]):0;if(_pi<routeCoords.length-1&&_gap<=10){var _t0=ROUTE_TIMES[_pi],_t1=ROUTE_TIMES[_pi+1]||_t0+1;var _fr=Math.max(0,Math.min(1,(_t1>_t0?(m-_t0)/(_t1-_t0):0)));var _p0=routeCoords[_pi],_p1=routeCoords[_pi+1];_pc=[_p0[0]+_fr*(_p1[0]-_p0[0]),_p0[1]+_fr*(_p1[1]-_p0[1])];}else{_pc=routeCoords[_pi];}}var _capT=m;HIKE_TIMES.forEach(function(h){if(m>=h.s&&m<h.e)_capT=h.s;});var pts=routeCoords.filter(function(_,i){return ROUTE_TIMES[i]<=_capT;});if(_pc&&pts.length>0){pts=pts.slice();pts[pts.length-1]=_pc;}map.getSource('route').setData({type:'Feature',geometry:{type:'LineString',coordinates:pts.length>=2?pts:routeCoords.slice(0,1)}});HIKE_TIMES.forEach(function(h,i){var vis=m<h.s?'none':'visible';['hike-'+i+'-casing','hike-'+i].forEach(function(id){if(map.getLayer(id))map.setLayoutProperty(id,'visibility',vis);});if(hikeMarkers[i])hikeMarkers[i].getElement().style.display=m<h.s?'none':'';if(m>=h.s){var hpts=HIKE_COORDS[i].filter(function(_,j){return HIKE_POINT_TIMES[i][j]<=m;});if(m<h.e){var _hpi=-1;for(var _hi=0;_hi<HIKE_POINT_TIMES[i].length;_hi++){if(HIKE_POINT_TIMES[i][_hi]<=m)_hpi=_hi;else break;}if(_hpi>=0&&_hpi<HIKE_COORDS[i].length-1){var _ht0=HIKE_POINT_TIMES[i][_hpi],_ht1=HIKE_POINT_TIMES[i][_hpi+1]||_ht0+1;var _hfr=Math.max(0,Math.min(1,(_ht1>_ht0?(m-_ht0)/(_ht1-_ht0):0)));var _hp0=HIKE_COORDS[i][_hpi],_hp1=HIKE_COORDS[i][_hpi+1];_pc=[_hp0[0]+_hfr*(_hp1[0]-_hp0[0]),_hp0[1]+_hfr*(_hp1[1]-_hp0[1])];if(hpts.length>0){hpts=hpts.slice();hpts[hpts.length-1]=_pc;}}}if(hpts.length>=2&&map.getSource('hike-'+i))map.getSource('hike-'+i).setData({type:'Feature',geometry:{type:'LineString',coordinates:hpts}});}});if(false){var feats=ALL_PHOTOS.filter(function(f){return f.properties.t<=m;});map.getSource('photos').setData({type:'FeatureCollection',features:feats});}if(_pc){map.getSource('pos').setData({type:'Feature',geometry:{type:'Point',coordinates:_pc}});}};
  if(typeof window.tlSync==='function')window.tlSync();else if(typeof window.tlUpdate==='function')window.tlUpdate(1440);

  document.getElementById('chk-route').addEventListener('change',e=>{['route','route-casing'].forEach(id=>map.setLayoutProperty(id,'visibility',e.target.checked?'visible':'none'));});
  document.getElementById('chk-hikes').addEventListener('change',e=>{["hike-0-casing", "hike-0"].forEach(id=>map.setLayoutProperty(id,'visibility',e.target.checked?'visible':'none'));hikeMarkers.forEach(m=>m.getElement().style.display=e.target.checked?'':'none');});
  document.getElementById('chk-poi-charging').addEventListener('change',e=>(poiGroups['charging']||[]).forEach(m=>m.getElement().style.display=e.target.checked?'':'none'));
});
